kind = "web"
previewPath = "/"
title = "سجل نقاط تركس"
version = "1.0.0"
id = "artifacts/trix-scoreboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20584

[services.development]
run = "pnpm --filter @workspace/trix-scoreboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trix-scoreboard", "run", "build" ]
publicDir = "artifacts/trix-scoreboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20584"
BASE_PATH = "/"
